schema_version: 1
claim_label: ASSUMED

# ASSUMED: These are safety and measurement policies, not Binance account facts.
budgets:
  max_probes_per_run: 7
  max_probes_per_minute: 2
  retry_after_cap_seconds: 60
  backoff_base_seconds: 1
  backoff_max_seconds: 32

capabilities:
  - id: spot
    scope: trade
    product: spot
    operation: order_validation
    probe_policy: non_executing_only
    symbol_source: exchangeInfo
    threshold_source: exchangeInfo.filters.MIN_NOTIONAL
  - id: margin
    scope: trade
    product: margin
    operation: order_validation
    probe_policy: non_executing_only
    symbol_source: exchangeInfo
    threshold_source: exchangeInfo.filters.MIN_NOTIONAL
  - id: convert
    scope: trade
    product: convert
    operation: quote_validation
    probe_policy: non_executing_only
    symbol_source: product_metadata
    threshold_source: product_metadata
  - id: usd_m_futures
    scope: trade
    product: USDⓈ-M futures
    operation: order_validation
    probe_policy: non_executing_only
    symbol_source: exchangeInfo
    threshold_source: exchangeInfo.filters.MIN_NOTIONAL
  - id: coin_m_futures
    scope: trade
    product: COIN-M futures
    operation: order_validation
    probe_policy: non_executing_only
    symbol_source: exchangeInfo
    threshold_source: exchangeInfo.filters.MIN_NOTIONAL-or-PRICE_FILTER
  - id: transfer
    scope: transfer
    product: internal Agentic sub-account transfer
    operation: transfer_validation
    probe_policy: non_executing_only
    symbol_source: account_metadata
    threshold_source: account_metadata
