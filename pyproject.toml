[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "keyring-authority-audit"
version = "0.1.0"
description = "AI permission auditor for Binance Agent OS with evidence-backed authority measurement"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pandas>=2.0,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.7,<2",
  "mypy>=1.10,<2",
  "pytest>=8,<9",
]

[project.scripts]
keyring = "keyring.cli:main"

[project.urls]
Homepage = "https://github.com/holybunnie/keyring"
Repository = "https://github.com/holybunnie/keyring"
Issues = "https://github.com/holybunnie/keyring/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.mypy]
python_version = "3.11"
files = ["src/keyring"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true

# pandas pulls in numpy, whose shipped stubs use `type X = ...` and therefore
# cannot be parsed under a 3.11 target. Skipping them keeps the type-check on
# this package's own code, which is what the gate is for.
[[tool.mypy.overrides]]
module = ["numpy.*", "pandas.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
ignore_missing_imports = true
